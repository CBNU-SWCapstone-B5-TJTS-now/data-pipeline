# Nowhere Data Pipeline - Docker Compose 설계 (AWS EC2 이전용)
#
# 목적: 기존 OCI vm-03(Oracle Linux 8) 위에 수동으로 구축했던 파이프라인
#      (PostgreSQL+PostGIS / Streamlit / cron / nginx)을 AWS EC2로
#      이전하기 위한 컨테이너화 설계. Object Storage 백업은 AWS S3로 전환됨
#      (scripts/upload_to_object_storage.py 참고).
#
# 주의: 이 파일은 설계 수준 산출물이며 실제 동작 검증(docker compose up)은
#      수행하지 않았습니다. 실제 EC2 인스턴스 프로비저닝/배포는 별도 작업입니다.
#
# Amazon Linux 2023 기준 설계 포인트:
#   - SELinux를 기본적으로 사용하지 않으므로 :z 마운트 플래그는 불필요 (호스트가
#     Oracle Linux 등 SELinux Enforcing 환경이면 필요 시 다시 추가)
#   - 컨테이너 postgres 포트는 호스트에 기존 PostgreSQL이 설치돼 있을 경우
#     충돌 방지를 위해 5433으로 매핑

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: nowhere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crowd_pipeline
      POSTGRES_USER: crowd_app
      POSTGRES_PASSWORD: ${CROWD_APP_PW}
    ports:
      - "5433:5432"   # 호스트 5432(기존 PostgreSQL)와 충돌 방지
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowd_app -d crowd_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nowhere-net

  streamlit:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: nowhere-streamlit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432   # 컨테이너 네트워크 내부 통신은 postgres의 기본 포트 그대로 사용
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nowhere-net
    # 외부 노출 없음 - nginx를 통해서만 접근

  cron:
    build:
      context: .
      dockerfile: scripts/Dockerfile.cron
    container_name: nowhere-weather-cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nowhere-net

  nginx:
    image: nginx:1.25-alpine
    container_name: nowhere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - streamlit
    networks:
      - nowhere-net

networks:
  nowhere-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
